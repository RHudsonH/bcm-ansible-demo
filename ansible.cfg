[defaults]
inventory = inventory/hosts.yml
collections_path = ./collections
# brightcomputing.bcm100 action plugins force /cm/local/apps/python3/bin/python
# for their own modules; builtin modules use whatever python the host has.
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
host_key_checking = True
forks = 10

[ssh_connection]
pipelining = True
